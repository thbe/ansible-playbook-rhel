---
- name: Configure local AWS OS disk
  hosts: all
  become: true
  become_user: root

  tasks:
    # Install parted
    - name: Install parted
      ansible.builtin.package:
        name: parted
        state: present

    # Check if OS disk exist on local system
    - name: Check if OS data disk /dev/nvme1n1 exists
      ansible.builtin.stat:
        path: /dev/nvme1n1
      register: stat_result_root

    - name: Configure OS disk
      when:
        - ansible_facts['system_vendor'] == "Amazon EC2"
        - ansible_facts['distribution'] == "RedHat"
        - stat_result_root.stat.exists
      block:
        # Setup volume group for OS
        - name: Create volume group rootvg on /dev/nvme1n1
          community.general.lvg:
            vg: rootvg
            pvs: /dev/nvme1n1

        # Setup logical volumes for OS
        - name: Create 16G logical volume rootlv, usrlv and varlv in volume group rootvg
          community.general.lvol:
            vg: rootvg
            lv: "{{ item }}"
            size: 16g
            resizefs: true
          loop:
            - rootlv
            - usrlv
            - varlv

        - name: Create 4G logical volume homelv and tmplv in volume group rootvg
          community.general.lvol:
            vg: rootvg
            lv: "{{ item }}"
            size: 4g
            resizefs: true
          loop:
            - homelv
            - tmplv

        - name: Create 64G logical volume swap in volume group rootvg
          community.general.lvol:
            vg: rootvg
            lv: swap
            size: 64g
